<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecrutaRS - Recrutamento Inteligente</title>
    <meta name="description" content="Plataforma de recrutamento inteligente com avaliação comportamental e matching por IA" />
    <meta name="author" content="AILA Automação Inteligente" />

    <meta property="og:title" content="RecrutaRS - Recrutamento Inteligente" />
    <meta property="og:description" content="Conectamos empresas aos melhores talentos através de avaliações comportamentais científicas" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RecrutaRS" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <script>
      // Evita flash de tema errado ao carregar
      try {
        const theme = localStorage.getItem('recrutars-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (theme === 'dark' || (theme === 'system' && systemPrefersDark) || (!theme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
